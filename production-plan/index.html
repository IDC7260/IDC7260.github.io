<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>IDC 생산계획서</title>
<link rel="icon" href="./IDCIcon-512.png" />
<link rel="manifest" href="./manifest.json" />
<link rel="stylesheet" href="./style.css" type="text/css">
<!-- 엑셀(.xlsx, .xls) 파싱 및 내보내기용 SheetJS / ExcelJS -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "c5034791-eb65-402f-89d0-c212c9e82137",
      serviceWorkerParam: { scope: "/production-plan/onesignal/" },
      serviceWorkerPath: "/production-plan/onesignal/OneSignalSDKWorker.js"
    });
  });
</script>
</head>
<body>
  <!-- PWA 설치 버튼 -->
  <button id="install-btn" type="button">📲 앱 설치</button>

  <!-- 1. 초기 화면: 임프린팅 / 1호기 / 2호기 선택 -->
  <section id="select-screen">
    <button type="button" class="line-btn line-imprinting" id="btn-line-imprinting">
      <span class="line-badge">IMPRINTING</span>
      <span class="line-title">임프린팅</span>
      <span class="line-sub">터치하여 임프린팅 생산계획서 보기</span>
    </button>

    <button type="button" class="line-btn line-1" id="btn-line-1">
      <span class="line-badge">LINE 01</span>
      <span class="line-title">1호기</span>
      <span class="line-sub">터치하여 1호기 생산계획서 보기</span>
    </button>

    <button type="button" class="line-btn line-2" id="btn-line-2">
      <span class="line-badge">LINE 02</span>
      <span class="line-title">2호기</span>
      <span class="line-sub">터치하여 2호기 생산계획서 보기</span>
    </button>
  </section>

  <!-- 2. 사원 로그인 / 계정 신청 화면 (미인증 상태에서 호기 진입 시 표시) -->
  <section id="login-screen" style="display: none;">
    <div class="login-card">
      <div class="login-badge">IDC INTERNAL</div>
      <h2>사원 인증 필요</h2>
      <p id="login-target-desc" class="login-sub">생산계획서를 열람하려면 로그인하세요</p>

      <!-- 로그인 / 계정 신청 탭 -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login">로그인</button>
        <button type="button" class="auth-tab" id="tab-signup">계정 신청</button>
      </div>

      <!-- 로그인 폼 -->
      <form id="login-form">
        <input type="text" id="login-id" placeholder="사번 (예: 1001)" required autocomplete="username" />
        <p id="login-error" class="login-error"></p>
        <button type="submit" id="btn-login" class="login-submit-btn">로그인 후 계획서 보기</button>
      </form>

      <!-- 계정 신청(가입) 폼 -->
      <form id="signup-form" style="display: none;">
        <input type="text" id="signup-name" placeholder="성명 / 직책 (예: 홍길동 반장)" required />
        <input type="text" id="signup-id" placeholder="사용할 사번 (예: 1001)" required />
        <p id="signup-error" class="login-error"></p>
        <button type="submit" id="btn-signup" class="login-submit-btn">가입 신청하기</button>
      </form>

      <!-- 승인 대기 안내 박스 -->
      <div id="pending-box" style="display: none; text-align: center; padding: 10px 0;">
        <p style="font-size: 1.05rem; font-weight: 700; color: #d97706; margin: 0 0 8px;">⏳ 관리자 승인 대기 중</p>
        <p id="pending-user-info" style="font-size: 0.88rem; color: #475569; line-height: 1.5; margin: 0 0 18px;"></p>
        <button type="button" id="btn-pending-refresh" class="login-submit-btn" style="margin-bottom: 8px;">승인 상태 새로고침</button>
        <button type="button" id="btn-pending-logout" style="width:100%; padding:10px; background:#e2e8f0; color:#334155; border:none; border-radius:10px; font-weight:700; cursor:pointer;">다른 계정으로 로그인</button>
      </div>

      <button type="button" id="btn-login-cancel" class="login-cancel-btn">← 호기 선택으로 돌아가기</button>
    </div>
  </section>

  <!-- 3. 생산계획서 좌우 슬라이드 화면 -->
  <section id="plan-screen" style="display: none;">
    <header class="plan-header">
      <div class="header-left">
        <select id="line-select" class="nav-btn line-select-box" aria-label="호기 선택">
          <option value="imprinting">임프린팅</option>
          <option value="1">1호기</option>
          <option value="2">2호기</option>
        </select>
        <span id="current-header-title">날짜 불러오는 중...</span>
        <button type="button" id="btn-today" class="nav-btn today-btn">오늘로 이동</button>
      </div>

      <div class="header-right">
        <select id="week-select" class="nav-btn"></select>
        <button type="button" id="btn-weekly-overview" class="nav-btn overview-btn">📋 전체보기</button>
        <button type="button" id="btn-prev-day" class="nav-btn">◀ 이전일</button>
        <button type="button" id="btn-next-day" class="nav-btn">다음일 ▶</button>
        <button type="button" id="btn-logout-plan" class="nav-btn logout-nav-btn">로그아웃</button>
      </div>
    </header>

    <!-- 권한자 전용 편집 툴바 -->
    <div id="planner-toolbar" class="planner-toolbar">
      <div class="planner-toolbar-right">
        <button type="button" id="btn-enable-admin-push" class="tool-btn">🔔 알림 켜기</button>
        <button type="button" id="btn-add-next-week" class="tool-btn">➕ 다음 주차 생성</button>
        <button type="button" id="btn-export-excel" class="tool-btn">📥 주간 엑셀 받기</button>
        <button type="button" id="btn-import-excel" class="tool-btn">📤 주간 엑셀 업로드</button>
        <button type="button" id="btn-open-manual-edit" class="tool-btn primary">✏️ 현재 일자 수동 수정</button>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;" />
      </div>
    </div>

    <main id="plan-viewport">
      <!-- InfinitePlanRenderer가 여기에 가로 무한 슬라이더를 렌더링 -->
    </main>
  </section>

  <!-- 4. 수동 수정 모달 (권한자 전용) -->
  <div id="plan-edit-modal" class="edit-modal-backdrop">
    <div class="edit-modal-card">
      <div class="edit-modal-header">
        <h3 id="edit-modal-title">생산계획서 수동 수정</h3>
      </div>
      <div class="edit-modal-body">
        <table class="edit-table">
          <thead>
            <tr>
              <th style="width: 64px;">순번</th>
              <th style="min-width: 180px;">품명 및 사양</th>
              <th style="width: 110px;">수량</th>
              <th style="width: 110px;">공정</th>
              <th style="min-width: 140px;">비고 (※)</th>
              <th style="width: 64px;">삭제</th>
            </tr>
          </thead>
          <tbody id="edit-modal-tbody"></tbody>
        </table>
      </div>
      <div class="edit-modal-footer">
        <button type="button" class="tool-btn" id="btn-modal-add-row">➕ 행 추가</button>
        <div class="edit-modal-actions">
          <button type="button" class="tool-btn" id="btn-modal-cancel">취소</button>
          <button type="button" class="tool-btn primary" id="btn-modal-save">💾 저장하기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. 주간 생산계획서 전체보기 모달 -->
  <div id="weekly-overview-modal" class="edit-modal-backdrop">
    <div class="edit-modal-card overview-modal-card">
      <div class="edit-modal-header">
        <h3 id="overview-modal-title">📋 주간 통합생산계획서 전체보기</h3>
        <button type="button" id="btn-toggle-overview-rotate" class="tool-btn">🔄 가로로 보기</button>
      </div>
      <div class="edit-modal-body overview-modal-body" id="overview-modal-body"></div>
      <div class="edit-modal-footer" style="justify-content: flex-end;">
        <button type="button" class="tool-btn primary" id="btn-overview-close-bottom">닫기</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
